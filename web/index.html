<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lingonberry media</title>
  <meta name="description" content="Plan what we're watching tonight.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='12' cy='19' r='8' fill='%23c8344f'/%3E%3Ccircle cx='21' cy='14' r='7' fill='%23e04a63'/%3E%3Cpath d='M18 7c2-4 6-5 9-4-1 3-4 5-9 4z' fill='%236f9b6a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <p id="demo-banner" class="demo-banner" hidden>
    Demo mode with sample titles. Nothing is saved. Add your Supabase details to <code>config.js</code> to go live.
  </p>

  <main id="login" class="login" hidden>
    <form id="login-form" class="login-card">
      <h1 class="brand brand-large">lingonberry media</h1>
      <p class="login-lede">Tonight's lineup, for two.</p>
      <label class="field">
        <span>Email</span>
        <input type="email" name="email" autocomplete="email" required>
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <p id="login-error" class="form-error" role="alert"></p>
      <button class="btn btn-primary" type="submit">Sign in</button>
    </form>
  </main>

  <div id="app" class="app" hidden>
    <header class="topbar">
      <h1 class="brand">lingonberry media</h1>
      <button id="sign-out" class="btn btn-quiet" type="button">Sign out</button>
    </header>

    <nav id="week" class="week" aria-label="Choose a night"></nav>

    <div class="layout">
      <section id="night" class="night" aria-live="polite"></section>
      <aside id="panel" class="panel" aria-label="Add to the night"></aside>
    </div>

    <footer class="site-foot">
      Titles, posters and runtimes from <a href="https://www.themoviedb.org/" rel="noopener">TMDB</a>.
      This product uses the TMDB API but is not endorsed or certified by TMDB.
    </footer>
  </div>

  <dialog id="dialog" class="dialog"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
