<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lingonberry media</title>
  <meta name="description" content="Plan what we're watching tonight.">
  <meta name="theme-color" content="#0D0E11">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 18'%3E%3Ccircle cx='7' cy='11' r='5' fill='%23d6455d'/%3E%3Ccircle cx='12' cy='8' r='4.2' fill='%23d6455d' opacity='.55'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <p id="demo-banner" class="demo-banner" hidden>
    Demo mode with sample titles. Nothing is saved.
  </p>

  <main id="login" class="login" hidden>
    <form id="login-form" class="login-card">
      <p class="brand"><svg class="brand-mark" aria-hidden="true" viewBox="0 0 18 18"><circle cx="7" cy="11" r="5"/><circle cx="12" cy="8" r="4.2" opacity=".55"/></svg>lingonberry media</p>
      <h1 class="login-title">Sign in</h1>
      <label class="field">
        <span>Email</span>
        <input type="email" name="email" autocomplete="email" required>
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <p id="login-error" class="form-error" role="alert"></p>
      <button class="btn btn-primary btn-block" type="submit">Sign in</button>
    </form>
  </main>

  <div id="app" class="app" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <p class="brand"><svg class="brand-mark" aria-hidden="true" viewBox="0 0 18 18"><circle cx="7" cy="11" r="5"/><circle cx="12" cy="8" r="4.2" opacity=".55"/></svg>lingonberry media</p>
        <nav id="week" class="week" aria-label="Choose a night"></nav>
        <div class="search-wrap">
          <label class="search">
            <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
            <span class="sr-only">Search movies and shows</span>
            <input id="search-input" type="search" placeholder="Search movies and shows" autocomplete="off"
                   aria-controls="search-results" aria-expanded="false">
            <kbd aria-hidden="true">/</kbd>
          </label>
          <div id="search-results" class="search-results" hidden></div>
        </div>
        <button id="sign-out" class="btn btn-ghost btn-sm" type="button">Sign out</button>
      </div>
    </header>

    <main class="page">
      <section id="night" class="night" aria-live="polite"></section>
      <section id="queue" class="queue" aria-label="Queue"></section>
      <footer class="site-foot">
        Titles, posters and runtimes from <a href="https://www.themoviedb.org/" rel="noopener">TMDB</a>.
        This product uses the TMDB API but is not endorsed or certified by TMDB.
      </footer>
    </main>
  </div>

  <dialog id="drawer" class="drawer" aria-labelledby="drawer-title"></dialog>
  <dialog id="dialog" class="dialog"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
