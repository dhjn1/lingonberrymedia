name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Schedule logic
        run: node --test tests/*.test.mjs
      - name: Database schema
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: tests/sql/run.sh
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge Functions
        run: deno test --allow-net --allow-env tests/functions_test.ts
      - name: Browser (demo mode)
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          python tests/e2e_demo.py

  pages:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4

  supabase:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Supabase settings
        id: check
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          [ -z "$SUPABASE_PROJECT_REF" ] && missing="$missing SUPABASE_PROJECT_REF"
          if [ -n "$missing" ]; then
            echo "::notice::Supabase deploy skipped. Not found as repository Actions secrets/variables:$missing (see README)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'true'
        with:
          version: latest
      - name: Find database connection
        if: steps.check.outputs.ready == 'true'
        id: db
        run: |
          # Ask the Management API for the connection pooler host (needs only
          # Connection Pooling: Read), then build the URL with the DB password.
          # This avoids `supabase link`, which wants access to secret API keys.
          code=$(curl -sS -o pooler.json -w '%{http_code}' \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/database/pooler")
          if [ "$code" != "200" ]; then
            echo "::error title=Pooler lookup failed::HTTP $code $(head -c 400 pooler.json)"
            exit 1
          fi
          url=$(python3 - <<'PY'
          import json, os, urllib.parse
          cfg = json.load(open("pooler.json"))
          cfg = cfg[0] if isinstance(cfg, list) else cfg
          pw = urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe="")
          print(f"postgresql://{cfg['db_user']}:{pw}@{cfg['db_host']}:5432/{cfg.get('db_name') or 'postgres'}")
          PY
          )
          echo "::add-mask::$url"
          echo "DB_URL=$url" >> "$GITHUB_ENV"
      - name: Apply database migrations
        if: steps.check.outputs.ready == 'true'
        run: |
          set -o pipefail
          if ! supabase db push --db-url "$DB_URL" --include-all 2>&1 | tee out.log; then
            msg=$(tail -n 8 out.log | tr '\n' ' ' | cut -c1-900)
            echo "::error title=Database migrations failed::$msg"
            exit 1
          fi
      - name: Deploy Edge Functions
        if: steps.check.outputs.ready == 'true'
        run: |
          set -o pipefail
          if ! supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" 2>&1 | tee out.log; then
            msg=$(tail -n 8 out.log | tr '\n' ' ' | cut -c1-900)
            echo "::error title=Edge Functions deploy failed::$msg"
            exit 1
          fi
